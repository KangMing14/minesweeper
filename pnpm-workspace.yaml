# Workspace members. Dependency direction is enforced by each package.json
# (and, from M0-T03, by lint): engine <- protocol <- apps/server, apps/web.
packages:
  - packages/*
  - apps/*

# Make `engines` in package.json binding: installing on a Node older than 24.15.0 fails
# (ERR_PNPM_UNSUPPORTED_ENGINE) instead of passing silently. (`engine-strict` in .npmrc is ignored by pnpm 12.)
engineStrict: true
